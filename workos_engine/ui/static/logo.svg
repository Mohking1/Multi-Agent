<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" class="w-full h-full">
  <defs>
    <linearGradient id="argusGradient" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="pupilGradient" x1="20" y1="20" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Focal Glow -->
  <circle cx="24" cy="24" r="22" fill="url(#glowGradient)" />

  <!-- Outer Precision Reticle Ring -->
  <circle cx="24" cy="24" r="20" stroke="url(#argusGradient)" stroke-width="1.75" stroke-dasharray="2 3" opacity="0.6" />
  
  <!-- Main Aperture Outer Boundary -->
  <circle cx="24" cy="24" r="16.5" stroke="url(#argusGradient)" stroke-width="2" />

  <!-- Aperture Iris Blades (Panoptic All-Seeing Geometry) -->
  <path d="M 24 7.5 A 16.5 16.5 0 0 1 38.3 16 L 24 24 Z" fill="url(#argusGradient)" fill-opacity="0.12" stroke="url(#argusGradient)" stroke-width="1.25" stroke-linejoin="round" />
  <path d="M 38.3 16 A 16.5 16.5 0 0 1 40.5 24 L 24 24 Z" fill="url(#argusGradient)" fill-opacity="0.18" stroke="url(#argusGradient)" stroke-width="1.25" stroke-linejoin="round" />
  <path d="M 40.5 24 A 16.5 16.5 0 0 1 35.7 35.7 L 24 24 Z" fill="url(#argusGradient)" fill-opacity="0.12" stroke="url(#argusGradient)" stroke-width="1.25" stroke-linejoin="round" />
  <path d="M 35.7 35.7 A 16.5 16.5 0 0 1 24 40.5 L 24 24 Z" fill="url(#argusGradient)" fill-opacity="0.18" stroke="url(#argusGradient)" stroke-width="1.25" stroke-linejoin="round" />
  <path d="M 24 40.5 A 16.5 16.5 0 0 1 9.7 32 L 24 24 Z" fill="url(#argusGradient)" fill-opacity="0.12" stroke="url(#argusGradient)" stroke-width="1.25" stroke-linejoin="round" />
  <path d="M 9.7 32 A 16.5 16.5 0 0 1 7.5 24 L 24 24 Z" fill="url(#argusGradient)" fill-opacity="0.18" stroke="url(#argusGradient)" stroke-width="1.25" stroke-linejoin="round" />
  <path d="M 7.5 24 A 16.5 16.5 0 0 1 12.3 12.3 L 24 24 Z" fill="url(#argusGradient)" fill-opacity="0.12" stroke="url(#argusGradient)" stroke-width="1.25" stroke-linejoin="round" />
  <path d="M 12.3 12.3 A 16.5 16.5 0 0 1 24 7.5 L 24 24 Z" fill="url(#argusGradient)" fill-opacity="0.18" stroke="url(#argusGradient)" stroke-width="1.25" stroke-linejoin="round" />

  <!-- Focal Aperture Inner Ring -->
  <circle cx="24" cy="24" r="6" stroke="#06B6D4" stroke-width="1.5" fill="#09090B" />

  <!-- Glowing Core Pupil -->
  <circle cx="24" cy="24" r="3" fill="url(#pupilGradient)" />
  <circle cx="25" cy="23" r="0.8" fill="#FFFFFF" opacity="0.9" />
</svg>
