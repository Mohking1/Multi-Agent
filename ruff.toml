# Ruff configuration for WorkOS
target-version = "py312"
line-length = 100

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (FastAPI File/Form/Depends)
    "B904",   # raise from e inside except
    "E402",   # module level import not at top of file
    "BLE001", # blind exception catching
    "S110",   # try-except-pass
    "RUF012", # mutable class attribute
]

[format]
quote-style = "double"
indent-style = "space"
